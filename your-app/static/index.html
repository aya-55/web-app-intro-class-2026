<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>アニメ記録</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- ヘッダー -->
    <header class="header">
      <h1>アニメ記録</h1>
    </header>

    <!-- メインコンテンツ -->
    <main class="todo-card">
      <!-- エラーメッセージ表示エリア -->
      <div id="error-message" class="error-message" style="display: none"></div>

      <!-- 🏆 アニメ視聴データダッシュボード -->
      <div class="stats-area" style="display: flex; gap: 10px; margin-bottom: 20px;">
        <div style="flex: 1; background: #f1f2f6; padding: 10px; border-radius: 8px; text-align: center; border-left: 5px solid #2ed573;">
          <span style="font-size: 12px; color: #666; display: block;">観終えた作品</span>
          <strong id="total-anime-count" style="font-size: 20px; color: #2ed573;">0</strong> <span style="font-size: 12px;">本</span>
        </div>
        <div style="flex: 1; background: #f1f2f6; padding: 10px; border-radius: 8px; text-align: center; border-left: 5px solid #007bff;">
          <span style="font-size: 12px; color: #666; display: block;">トータル視聴話数</span>
          <strong id="total-episode-count" style="font-size: 20px; color: #007bff;">0</strong> <span style="font-size: 12px;">話</span>
        </div>
      </div>

      <!-- アニメ入力エリア -->
      <form id="todo-form" class="input-area" style="display: flex; gap: 10px;">
        <input
          type="text"
          id="todo-input"
          class="todo-input"
          placeholder="観たいアニメを入力..."
          maxlength="100"
          autocomplete="off"
          style="flex: 3;"
        />
        <input
          type="number"
          id="todo-total-ep"
          class="todo-input"
          value="12"
          min="1"
          max="1000"
          placeholder="総話数"
          style="flex: 1; text-align: center;"
        />
        <button type="submit" class="todo-button">追加</button>
      </form>

      <!-- 🔍 キーワード検索窓 -->
      <div class="search-area" style="margin: 15px 0 5px 0;">
        <input
          type="text"
          id="search-input"
          class="todo-input"
          placeholder="登録したアニメを検索..."
          autocomplete="off"
          style="width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ddd; border-radius: 4px;"
        />
      </div>
            <!-- 🛠️ 一括選択・操作エリア -->
      <div class="bulk-actions" style="margin: 10px 0; display: flex; gap: 10px; justify-content: flex-end;">
        <button type="button" onclick="bulkWatch()" id="bulk-watch-btn" style="background-color: #2ed573; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; display: none;">選択した作品を観た！</button>
        <button type="button" onclick="bulkDelete()" style="background-color: #ff4757; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;">選択した作品を削除</button>
      </div>

      <!-- タブメニュー -->
      <div class="tabs" style="display: flex; margin: 15px 0; border-bottom: 2px solid #ddd;">
        <button type="button" id="tab-want" onclick="switchTab('want')" style="flex: 1; padding: 10px; background: none; border: none; font-size: 16px; cursor: pointer; border-bottom: 3px solid #007bff; font-weight: bold;">これから観る</button>
        <button type="button" id="tab-watched" onclick="switchTab('watched')" style="flex: 1; padding: 10px; background: none; border: none; font-size: 16px; cursor: pointer; color: #777;">これまでに観た</button>
      </div>

      <!-- アメリスト -->
      <ul id="todo-list" class="todo-list"></ul>
    </main>

    <!-- フッター -->
    <footer class="footer">
      <p>&copy; 2026 アニメ記録</p>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
