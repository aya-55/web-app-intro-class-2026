<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>アニメ記録</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- ヘッダー -->
    <header class="header">
      <h1>アニメ記録</h1>
    </header>

    <!-- メインコンテンツ -->
    <main class="todo-card">
      <!-- エラーメッセージ表示エリア -->
      <div id="error-message" class="error-message" style="display: none"></div>

      <!-- TODO入力エリア -->
      <form id="todo-form" class="input-area">
        <input
          type="text"
          id="todo-input"
          class="todo-input"
          placeholder="観たいアニメを入力..."
          maxlength="100"
          autocomplete="off"
        />
        <button type="submit" class="todo-button">追加</button>
      </form>

      <div class="tabs" style="display: flex; margin: 15px 0; border-bottom: 2px solid #ddd;">
        <!-- 💡 onclick="..." を付け足しました！ -->
        <button type="button" id="tab-want" onclick="switchTab('want')" style="flex: 1; padding: 10px; background: none; border: none; font-size: 16px; cursor: pointer; border-bottom: 3px solid #007bff; font-weight: bold;">これから観る</button>
        <button type="button" id="tab-watched" onclick="switchTab('watched')" style="flex: 1; padding: 10px; background: none; border: none; font-size: 16px; cursor: pointer; color: #777;">これまでに観た</button>
      </div>


      <!-- TODOリスト -->
      <ul id="todo-list" class="todo-list"></ul>
    </main>

    <!-- フッター -->
    <footer class="footer">
      <p>&copy; 2026 アニメ記録</p>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
